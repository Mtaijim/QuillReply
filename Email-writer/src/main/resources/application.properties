spring.application.name=Email-writer

gemini.api.base=https://generativelanguage.googleapis.com/v1beta/models/
gemini.api.key=${GEMINI_API_KEY}
gemini.model.primary=gemini-3.1-flash-lite
gemini.model.fallback=gemini-3.5-flash

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

app.ratelimit.per-minute=5
app.ratelimit.per-day=40
app.ratelimit.global-per-minute=12

server.port=${PORT:8080}
server.forward-headers-strategy=native

server.error.include-stacktrace=never
server.error.include-message=never
